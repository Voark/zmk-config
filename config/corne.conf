# Enable deep sleep
CONFIG_ZMK_SLEEP=y

# Set timeout in milliseconds (1 hour = 3600000 milliseconds)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Enable mouse keys
CONFIG_ZMK_POINTING=y

# Debounce settings for Boba U4T switches
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=30
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5